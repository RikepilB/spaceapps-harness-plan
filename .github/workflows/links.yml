name: links

on:
  schedule:
    # Weekly. A dead catalogue link is cheap to fix now and costs someone an hour at
    # 02:00 on the Saturday if it is found during the event instead.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/spaceapps-harness/skills/nasa-data-access/**"
      - "scripts/check-links.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Dependency-free, like the structural validator: node 22 has fetch built in.
      - name: Check catalogue and doc links
        run: node scripts/check-links.mjs
